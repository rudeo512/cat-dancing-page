<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="155" rx="55" ry="50" fill="#FF8C00"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#FF8C00"/>

  <!-- Left ear -->
  <polygon points="60,50 45,15 80,40" fill="#FF8C00"/>
  <polygon points="62,48 50,22 77,42" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="140,50 155,15 120,40" fill="#FF8C00"/>
  <polygon points="138,48 150,22 123,42" fill="#FFB6C1"/>

  <!-- Face markings -->
  <ellipse cx="100" cy="95" rx="30" ry="25" fill="#FFA07A"/>

  <!-- Eyes -->
  <circle cx="83" cy="78" r="10" fill="white"/>
  <circle cx="117" cy="78" r="10" fill="white"/>
  <circle cx="85" cy="79" r="6" fill="#2E8B57"/>
  <circle cx="119" cy="79" r="6" fill="#2E8B57"/>
  <circle cx="86" cy="78" r="3" fill="#1a1a1a"/>
  <circle cx="120" cy="78" r="3" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="87" cy="76" r="1.5" fill="white"/>
  <circle cx="121" cy="76" r="1.5" fill="white"/>

  <!-- Nose -->
  <polygon points="100,95 96,100 104,100" fill="#FF69B4"/>

  <!-- Mouth -->
  <path d="M96,100 Q100,106 104,100" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M96,100 Q91,105 88,103" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M104,100 Q109,105 112,103" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="95" y1="100" x2="55" y2="95" stroke="#555" stroke-width="1.5"/>
  <line x1="95" y1="103" x2="55" y2="103" stroke="#555" stroke-width="1.5"/>
  <line x1="95" y1="106" x2="55" y2="111" stroke="#555" stroke-width="1.5"/>

  <!-- Whiskers right -->
  <line x1="105" y1="100" x2="145" y2="95" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="103" x2="145" y2="103" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="106" x2="145" y2="111" stroke="#555" stroke-width="1.5"/>

  <!-- Arms -->
  <ellipse cx="52" cy="155" rx="18" ry="28" fill="#FF8C00" transform="rotate(-15, 52, 155)"/>
  <ellipse cx="148" cy="155" rx="18" ry="28" fill="#FF8C00" transform="rotate(15, 148, 155)"/>

  <!-- Paws left -->
  <circle cx="40" cy="178" r="8" fill="#FFA07A"/>
  <circle cx="47" cy="182" r="7" fill="#FFA07A"/>

  <!-- Paws right -->
  <circle cx="160" cy="178" r="8" fill="#FFA07A"/>
  <circle cx="153" cy="182" r="7" fill="#FFA07A"/>

  <!-- Legs -->
  <ellipse cx="78" cy="195" rx="16" ry="22" fill="#FF8C00"/>
  <ellipse cx="122" cy="195" rx="16" ry="22" fill="#FF8C00"/>

  <!-- Feet -->
  <ellipse cx="75" cy="213" rx="18" ry="8" fill="#FFA07A"/>
  <ellipse cx="125" cy="213" rx="18" ry="8" fill="#FFA07A"/>

  <!-- Tail -->
  <path d="M150,170 Q185,140 175,110 Q165,80 155,95"
        stroke="#FF8C00" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M150,170 Q185,140 175,110 Q165,80 155,95"
        stroke="#FFA07A" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Belly stripe -->
  <ellipse cx="100" cy="155" rx="25" ry="30" fill="#FFA07A" opacity="0.5"/>

  <!-- Blush marks -->
  <ellipse cx="73" cy="92" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="127" cy="92" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
</svg>
